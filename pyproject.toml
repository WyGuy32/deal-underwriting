[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "underwrite"
version = "1.0.0"
description = "Rental property and leveraged buyout underwriting models in plain Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wyatt Cosgriff" }]
dependencies = []

[project.scripts]
underwrite = "underwrite.__main__:main"

[tool.setuptools]
packages = ["underwrite"]
